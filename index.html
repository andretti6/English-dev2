<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Presentation - Learning Arena</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --primary: #1e3a8a;
            --accent: #ff6b6b;
            --text-dark: #2d3748;
            --text-light: #718096;
            --success: #10b981;
            --disabled: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-dark); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed #cbd5e1; }
        header h1 { color: var(--primary); font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .current-phase-title { background-color: var(--primary); color: white; display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-top: 10px; font-size: 14px; }

        /* Setup Screen */
        #setup-screen { max-width: 500px; margin: 100px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        #setup-screen h2 { margin-bottom: 20px; color: var(--primary); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--text-light); }
        .input-group input { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 16px; }
        .input-group input:focus { border-color: var(--primary); outline: none; }
        
        /* Main Arena Grid */
        #arena-screen { display: none; flex-direction: column; height: 100%; flex-grow: 1; justify-content: space-between; }
        .players-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        /* Player Panels */
        .player-card { background: var(--card-bg); border: 4px solid var(--primary); border-radius: 12px; padding: 20px; position: relative; min-height: 380px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .player-name-tag { position: absolute; top: -15px; left: 20px; background: var(--accent); color: white; padding: 3px 15px; font-weight: bold; border-radius: 4px; font-size: 14px; border: 2px solid var(--primary); }
        
        .mission-box { border: 3px solid var(--text-dark); border-radius: 8px; padding: 15px; margin-top: 15px; flex-grow: 1; display: flex; flex-direction: column; background: #fafafa; }
        .mission-title-btn { background: var(--text-dark); color: white; border: none; padding: 10px; font-size: 15px; font-weight: bold; width: 100%; text-align: left; border-radius: 4px; cursor: pointer; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .mission-title-btn:hover { background: #4a5568; }
        .mission-title-btn::after { content: '👉 Reveal'; font-size: 12px; background: var(--accent); padding: 2px 6px; border-radius: 3px; }

        .mission-details { display: none; animation: fadeIn 0.3s ease forwards; flex-grow: 1; }
        .explanation-section { font-style: italic; color: #4a5568; background: #edf2f7; padding: 10px; border-radius: 4px; margin-bottom: 12px; border-left: 4px solid var(--primary); font-size: 14px; }
        .task-section { font-weight: bold; color: var(--text-dark); border: 2px dashed var(--accent); padding: 10px; border-radius: 4px; background: #fff5f5; font-size: 14px; }

        .empty-mission-state { color: var(--text-light); text-align: center; margin: auto; font-style: italic; font-weight: bold; }

        /* Action Controls */
        .card-actions { margin-top: 15px; display: flex; justify-content: flex-end; }
        .check-btn { background-color: var(--success); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s; }
        .check-btn:hover { opacity: 0.9; }

        /* Next Phase Button Footer (Locked and Unlocked states) */
        .footer-controls { text-align: center; margin-top: auto; padding: 20px 0; }
        .next-phase-btn { background-color: var(--primary); color: white; border: 4px solid var(--text-dark); padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 var(--text-dark); transition: all 0.1s; }
        .next-phase-btn:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--text-dark); }
        .next-phase-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .next-phase-btn:disabled { background-color: var(--disabled); color: #94a3b8; border-color: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Utilities & Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .btn-start { background: var(--primary); color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

    <!-- SCREEN 1: Setup and Names -->
    <main id="setup-screen">
        <h2>Enter Player Names</h2>
        <p style="color: var(--text-light); margin-bottom: 20px; font-size: 14px;">Fill 2 or 3 players to start the rotation training.</p>
        <div class="input-group">
            <label for="p1">Player A Name</label>
            <input type="text" id="p1" placeholder="e.g. Andre" value="Andre">
        </div>
        <div class="input-group">
            <label for="p2">Player B Name</label>
            <input type="text" id="p2" placeholder="e.g. Ana" value="Ana">
        </div>
        <div class="input-group">
            <label for="p3">Player C Name (Optional)</label>
            <input type="text" id="p3" placeholder="e.g. Miguel">
        </div>
        <button class="btn-start" onclick="startArena()">Start Training Arena</button>
    </main>

    <!-- SCREEN 2: The Learning Arena -->
    <div id="arena-screen">
        <header>
            <h1>Dynamic Learning Arena</h1>
            <div class="current-phase-title" id="phase-title">PHASE: LOADING</div>
        </header>

        <!-- Dynamic Content Rows for Players -->
        <section class="players-container" id="players-grid">
            <!-- Programmatically Injected via JS -->
        </section>

        <!-- Footer Control centered below -->
        <footer class="footer-controls">
            <button class="next-phase-btn" id="next-phase-btn" onclick="goToNextPhase()" disabled>Complete all items to unlock Next Phase &rarr;</button>
        </footer>
    </div>

    <script>
        const database = {
            "CONFIDENCE": [
                { item: "Use your intuition", def: "Trust your brain and speak without fear.", ex: "When you want to say something, don't overthink. Just open your mouth and start." },
                { item: "Think in English (Dictionaries, Audios, Texts)", def: "Do not translate to Portuguese. Connect words directly to objects.", ex: "Look at a table and think 'table', do not look and think 'mesa -> table'." },
                { item: "Trial and Error Mindset", def: "The cycle is: Try -> Learn -> Adjust -> Repeat.", ex: "Mistakes are good! Making mistakes means you are trying and actively learning." }
            ],
            "EARS": [
                { item: "Audio, audio, audio -> well trained ears!", def: "Listen to English every day to change your brain habits.", ex: "Play English audios in your house when you make coffee or wash dishes." },
                { item: "Create the image in your mind", def: "See the concept in your head like a picture instead of letters.", ex: "When you hear 'beach', visualize blue water, sun, and sand immediately." },
                { item: "Get the main idea first", def: "Understand the general context. Do not stop for unknown words.", ex: "If a person talks about a trip, understand they are happy, even if you miss details." },
                { item: "Get details as much as you can", def: "After the main idea, start capturing specific small facts.", ex: "Listen for numbers, colors, times, or places mentioned in the conversation." },
                { item: "Get your conclusion", def: "Use your logical thinking to discover the final message.", ex: "If the speaker says 'I forgot my jacket and it's raining', your conclusion is: they are cold." },
                { item: "Listen to different accents & topics", def: "Listen to real people from different countries and industries.", ex: "Listen to British podcasts, Indian tech videos, or Australian vlogs to adapt." },
                { item: "Use every possible resource", def: "Combine your hobbies with language practice.", ex: "Watch your favorite series, gaming streams, movies, or music with lyrics." }
            ],
            "WORDS": [
                { item: "Learn the word root and patterns", def: "Look at the central block of the word to know its family.", ex: "If you know 'Connect', you can understand 'Disconnect' and 'Connection'." },
                { item: "Learn the Latin influence", def: "Use the gift of cognates! Many academic words look like Portuguese.", ex: "Words like 'Conclusion', 'Different', and 'Symptom' are easy to guess." },
                { item: "Write them down and create sentences", def: "Do not just look at a word. Use it right away in practice.", ex: "Write the new word on a sticky note and make a sentence about your day." },
                { item: "Use mnemonics whenever possible", def: "Create funny connections or shortcuts to memorize formulas.", ex: "To remember 'Because', think 'Big Elephants Can Always Understand Small Elephants'." },
                { item: "Learn idioms and phrasals", def: "This is your superpower advantage to sound very natural.", ex: "Use 'Check out' instead of 'Look at' to blend in with native speakers." },
                { item: "Learn to spell the words and basics", def: "Master numbers, dates, months, and seasons correctly.", ex: "Practice spelling your email or reading out loud numbers like 2026." }
            ],
            "SPEAKING": [
                { item: "Improvise -> make it simple", def: "Do not try to speak like a book. Use simple words to explain big concepts.", ex: "If you don't know the word 'refrigerator', say 'the cold box for food'." },
                { item: "Ask for help: 'What's the word for...?'", def: "Use active rescue phrases when your vocabulary stops.", ex: "If you forget a word, ask: 'Hey, what's the word for the object to write?'" },
                { item: "Ask for clarification: 'Did you say...?'", def: "Confirm information immediately to avoid communication errors.", ex: "If the speaker says a number too fast, ask: 'Excuse me, did you say fifteen or fifty?'" },
                { item: "Confirm ideas: 'Are you saying...?'", def: "Repeat what you understood to validate with the listener.", ex: "Say: 'Are you saying we need to complete the task before tomorrow?'" },
                { item: "Always observe and imitate", def: "Look at native speakers and mimic their music and facial expressions.", ex: "Watch how characters in series say 'Oh my god' and copy the tone exactly." },
                { item: "Stick to people with better English", def: "Be around advanced speakers. They are an infinite source of knowledge.", ex: "Join advanced groups or talk to people who push your boundaries." }
            ],
            "READING": [
                { item: "Mix reading levels starting from yours", def: "Read easy texts first, then pick challenging ones.", ex: "Start with A2 children stories, then move to tech blogs or news articles." },
                { item: "Look around the word for definitions", def: "Use context clues. Do not jump to a dictionary instantly.", ex: "In 'The sky was dark and gloomy before the storm', 'gloomy' clearly means bad/gray weather." },
                { item: "Practice leads to perfection", def: "Consistency is better than intensity. Read a little every day.", ex: "Read 2 pages of an English book every morning instead of 50 pages on Sunday." }
            ],
            "WRITING": [
                { item: "Write without support first, then check", def: "Write completely from your head, then use AI or a teacher to fix.", ex: "Compose an email manually. Then paste it in ChatGPT to review mistakes." },
                { item: "Follow Sequence: Intro -> Details -> Conclusion", def: "Organize your paragraphs with a clean, classic logical pipeline.", ex: "Start with 'I am writing to...', add facts in the middle, end with 'Best regards'." },
                { item: "Read and listen to write well", def: "Input feeds output. Your intuition remembers sentence shapes.", ex: "If you read many emails, you will automatically write good emails." }
            ],
            "PRONUNCIATION": [
                { item: "Sounds / Linking / Intonation", def: "Connect words together and understand the music of sentences.", ex: "Don't say 'Not / at / all'. Say it connected like 'Not-at-all'." },
                { item: "Listen and repeat out loud", def: "You must hear your own voice speaking to adjust the muscle memory.", ex: "Read an English quote loudly in your room to train your mouth muscles." },
                { item: "Record your voice & Sing!", def: "Use your smartphone to capture your voice or copy songs.", ex: "Sing your favorite rock or pop music while reading the lyrics line by line." }
            ],
            "GRAMMAR": [
                { item: "Learn basics starting from Verb Tenses", def: "Master Past, Present, and Future perfectly before complex rules.", ex: "Know exactly how to use 'I worked', 'I work', and 'I will work' first." },
                { item: "Understand Why it exists vs How it works", def: "Learn the practical objective first, then the strict technical mechanics.", ex: "Why use Present Perfect? To talk about experiences! How? 'I have been to...'." },
                { item: "Cult language vs Spoken language", def: "Real people don't speak like rigid grammar books.", ex: "Books say 'Whom did you see?'. Real people always say 'Who did you see?'." }
            ]
        };

        const phases = Object.keys(database);
        let currentPhaseIndex = 0;
        let players = [];
        let currentPhaseMissions = [];
        let activeMissionsCount = 0;

        function startArena() {
            const p1 = document.getElementById('p1').value.trim();
            const p2 = document.getElementById('p2').value.trim();
            const p3 = document.getElementById('p3').value.trim();

            if (!p1 || !p2) {
                alert("Please enter at least Player A and Player B names.");
                return;
            }

            players = [p1, p2];
            if (p3) players.push(p3);

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';

            loadPhase(0);
        }

        function loadPhase(index) {
            if (index >= phases.length) {
                alert("🏆 Training Completed! Excellent teamwork!");
                return;
            }

            currentPhaseIndex = index;
            const phaseName = phases[index];
            document.getElementById('phase-title').innerText = `PHASE: ${phaseName}`;

            // Reset UI lock elements
            const nextBtn = document.getElementById('next-phase-btn');
            nextBtn.disabled = true;
            nextBtn.innerText = "Complete all items to unlock Next Phase 🔒";

            // Load original topics stack data
            currentPhaseMissions = JSON.parse(JSON.stringify(database[phaseName]));
            activeMissionsCount = players.length; // Each player starts with 1 slot active
            
            distributeMissions();
        }

        function distributeMissions() {
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';

            players.forEach((player, pIdx) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = `player-slot-${pIdx}`;
                
                let nextPlayerName = players[(pIdx + 1) % players.length];
                const currentMission = currentPhaseMissions.shift();

                let missionHTML = '';
                if (currentMission) {
                    missionHTML = `
                        <div class="mission-box">
                            <button class="mission-title-btn" onclick="toggleReveal(this)">
                                ${currentMission.item}
                            </button>
                            <div class="mission-details">
                                <div class="explanation-section">
                                    <strong>Definition:</strong> ${currentMission.def}<br><br>
                                    <strong>Example:</strong> ${currentMission.ex}
                                </div>
                                <div class="task-section">
                                    👉 <strong>YOUR TASK:</strong><br>
                                    1. Explain this strategy using your own words or personal experience.<br>
                                    2. Then, ask <strong>${nextPlayerName}</strong> to think of or give you a new example about it!
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="check-btn" onclick="completeMission(${pIdx})">✓ Clear Task</button>
                        </div>
                    `;
                } else {
                    activeMissionsCount--; // Fallback if cards < players count
                    missionHTML = `
                        <div class="empty-mission-state">
                            No initial cards left. Help your colleagues!
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="player-name-tag">${player}</div>
                    ${missionHTML}
                `;
                grid.appendChild(card);
            });
            
            checkPhaseStatus();
        }

        function toggleReveal(button) {
            const details = button.nextElementSibling;
            details.style.display = (details.style.display === 'block') ? 'none' : 'block';
        }

        function completeMission(playerIndex) {
            const card = document.getElementById(`player-slot-${playerIndex}`);
            
            if (currentPhaseMissions.length > 0) {
                // Pull next item and renew dashboard slot
                const nextMission = currentPhaseMissions.shift();
                let nextPlayerName = players[(playerIndex + 1) % players.length];

                const mBox = card.querySelector('.mission-box');
                mBox.innerHTML = `
                    <button class="mission-title-btn" onclick="toggleReveal(this)">
                        ${nextMission.item}
                    </button>
                    <div class="mission-details">
                        <div class="explanation-section">
                            <strong>Definition:</strong> ${nextMission.def}<br><br>
                            <strong>Example:</strong> ${nextMission.ex}
                        </div>
                        <div class="task-section">
                            👉 <strong>YOUR TASK:</strong><br>
                            1. Explain this strategy using your own words or personal experience.<br>
                            2. Then, ask <strong>${nextPlayerName}</strong> to think of or give you a new example about it!
                        </div>
                    </div>
                `;
            } else {
                // No items left in database stack, kill this active slot tracker
                activeMissionsCount--;
                card.innerHTML = `
                    <div class="player-name-tag">${players[playerIndex]}</div>
                    <div class="empty-mission-state">✓ Done! Support your remaining teammates.</div>
                `;
                
                checkPhaseStatus();
            }
        }

        function checkPhaseStatus() {
            // Unlocks button only if current stack is empty AND all active boards are cleared
            if (currentPhaseMissions.length === 0 && activeMissionsCount <= 0) {
                const nextBtn = document.getElementById('next-phase-btn');
                nextBtn.disabled = false;
                nextBtn.innerText = "Next Phase &rarr;";
            }
        }

        function goToNextPhase() {
            loadPhase(currentPhaseIndex + 1);
        }
    </script>
</body>
</html>
